# Pretraining on AMASS from convert_amass.py (scripts/pretrain_intent_forecaster.py).
# One person: the partner inputs are zeros, so Marginal only.
model: marginal
seed: 0
data_dir: ${oc.env:HOME}/data/amass_15hz
mapping_json: ${oc.env:HOME}/interact/mapping/amass_mapping.json
amass:
  joint_names: [Neck, L_Shoulder, R_Shoulder, L_Elbow, R_Elbow, L_Wrist, R_Wrist, L_Hand, R_Hand]
  frame: window       # window: relative to the pelvis and heading at the last history frame; world
centring: joint       # joint: each joint minus its own last history position (runs 0, 1);
                      # pelvis: none, the window frame's origin is kept (needs frame window)
epochs: 30
batch_size: 256
lr: 0.0003
weight_decay: 0.00001
milestones: [15, 25]
gamma: 0.1

hydra:
  run:
    dir: ${oc.env:HOME}/outputs/runs/${now:%Y-%m-%d_%H-%M-%S}_${model}
  sweep:
    dir: ${oc.env:HOME}/outputs/runs/${now:%Y-%m-%d_%H-%M-%S}_${model}_sweep
    subdir: ${hydra.job.num}
