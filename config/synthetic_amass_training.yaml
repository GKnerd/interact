model: marginal
seed: 0
# synthetic_amass: Alice and Bob (create_synthetic_amass_data.py)
# amass: Alice only (convert_amass.py); Bob is zeros, so Marginal only
dataset: synthetic_amass
data_dirs:
  synthetic_amass: ${oc.env:HOME}/data/synthetic_amass
  amass: ${oc.env:HOME}/data/amass_15hz
data_dir: ${data_dirs.${dataset}}
mapping_json: ${oc.env:HOME}/interact/mapping/amass_mapping.json
amass:                # dataset amass only
  joint_names: [Neck, L_Shoulder, R_Shoulder, L_Elbow, R_Elbow, L_Wrist, R_Wrist, L_Hand, R_Hand]
  frame: window       # window: relative to the pelvis and heading at the last history frame; world
epochs: 30
batch_size: 256
lr: 0.0003
weight_decay: 0.00001
milestones: [15, 25]
gamma: 0.1

hydra:
  run:
    dir: ${oc.env:HOME}/outputs/runs/${now:%Y-%m-%d_%H-%M-%S}_${model}_${dataset}
  sweep:
    dir: ${oc.env:HOME}/outputs/runs/${now:%Y-%m-%d_%H-%M-%S}_${model}_${dataset}_sweep
    subdir: ${hydra.job.num}
