  batch_size: 256

  checkpoint_dir: '${oc.env:HOME}/interact/interact/trained_models_cornell/HR_checkpoints'

hydra:
  run:
    dir: '${oc.env:HOME}/outputs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}'
